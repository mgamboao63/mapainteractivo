<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa interactivo - Primer piso</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #68758a;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --green: #16a34a;
      --orange: #f97316;
      --line: #d9e1ec;
      --shadow: 0 14px 35px rgba(31, 41, 55, .12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(17, 24, 39, .03);
      z-index: 3;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    main {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 0;
    }

    aside {
      position: relative;
      z-index: 2;
      padding: 16px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow: auto;
    }

    .control {
      display: grid;
      gap: 6px;
      margin-bottom: 14px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    select,
    button {
      width: 100%;
      min-height: 42px;
      border-radius: 8px;
      font-size: 15px;
    }

    select {
      padding: 8px 10px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #cfd8e6;
    }

    button {
      border: 0;
      color: #fff;
      background: var(--blue);
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--blue-dark);
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .tools button {
      min-height: 38px;
      color: var(--ink);
      background: #eef4ff;
      border: 1px solid #cfe0ff;
    }

    .summary {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
      font-size: 14px;
      line-height: 1.45;
    }

    .summary b {
      display: block;
      margin-bottom: 4px;
    }

    .steps {
      display: grid;
      gap: 8px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .steps li {
      padding: 9px 10px;
      border-left: 3px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 4px;
      color: #334155;
      font-size: 13px;
    }

    .map-shell {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(148, 163, 184, .13) 1px, transparent 1px),
        linear-gradient(0deg, rgba(148, 163, 184, .13) 1px, transparent 1px),
        #edf2f8;
      background-size: 32px 32px;
      touch-action: none;
    }

    .map-card {
      position: absolute;
      inset: 14px;
      overflow: hidden;
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      user-select: none;
    }

    svg.dragging {
      cursor: grabbing;
    }

    .route-line {
      fill: none;
      stroke: var(--blue);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 4 3;
      animation: routeFlow 1s linear infinite;
      paint-order: stroke;
      filter: drop-shadow(0 2px 3px rgba(37, 99, 235, .28));
    }

    .route-glow {
      fill: none;
      stroke: rgba(37, 99, 235, .18);
      stroke-width: 5.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: routeGlow 1.8s ease-in-out infinite;
    }

    @keyframes routeFlow {
      to { stroke-dashoffset: -14; }
    }

    @keyframes routeGlow {
      0%, 100% { stroke-opacity: .12; }
      50% { stroke-opacity: .32; }
    }

    .node {
      fill: #fff;
      stroke: rgba(37, 99, 235, .55);
      stroke-width: .45;
      opacity: 0;
    }

    .door {
      fill: #dbeafe;
      stroke: var(--blue);
      stroke-width: .55;
      opacity: 0;
    }

    .marker-origin,
    .marker-dest {
      stroke: #fff;
      stroke-width: 1.1;
      filter: drop-shadow(0 3px 5px rgba(15, 23, 42, .28));
    }

    .marker-origin {
      fill: var(--green);
    }

    .marker-dest {
      fill: var(--orange);
    }

    .pulse {
      fill: none;
      stroke: var(--orange);
      stroke-width: .8;
      opacity: .75;
      animation: pulse 1.4s ease-out infinite;
      transform-origin: center;
    }

    @keyframes pulse {
      from { r: 1.8; opacity: .75; }
      to { r: 6; opacity: 0; }
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 12px;
      }

      .controls-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .control {
        margin-bottom: 0;
      }

      .summary {
        margin-top: 10px;
      }

      .map-card {
        inset: 8px;
      }
    }

    @media (max-width: 560px) {
      header {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }

      .status {
        white-space: normal;
      }

      .controls-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Navegador interior - Primer piso</h1>
      <div class="status" id="status">Mapa listo</div>
    </header>

    <main>
      <aside>
        <div class="controls-grid">
          <div class="control">
            <label for="start">Estoy en</label>
            <select id="start"></select>
          </div>

          <div class="control">
            <label for="dest">Quiero ir a</label>
            <select id="dest"></select>
          </div>
        </div>

        <button id="routeBtn">Mostrar ruta</button>

        <div class="tools" aria-label="Controles de mapa">
          <button id="zoomIn" type="button">+</button>
          <button id="zoomOut" type="button">-</button>
          <button id="resetView" type="button">Centrar</button>
        </div>

        <div class="summary" id="summary">
          <b>Prueba de rutas</b>
          Elige un origen y un destino para dibujar el camino por los pasillos.
        </div>
      </aside>

      <section class="map-shell" id="mapShell">
        <div class="map-card">
          <svg id="mapSvg" viewBox="0 0 210 297" aria-label="Mapa del primer piso">
            <g id="viewport">
              <image href="piso1.svg" x="0" y="0" width="210" height="297" preserveAspectRatio="xMidYMid meet"></image>
              <g id="graphLayer"></g>
              <path id="routeGlow" class="route-glow"></path>
              <path id="routePath" class="route-line"></path>
              <g id="markerLayer"></g>
            </g>
          </svg>
        </div>
      </section>
    </main>
  </div>

  <script src="grafo-piso1.js"></script>
  <script src="destinos-piso1.js"></script>
  <script>
    const GRAPH_DATA = window.PISO1_GRAPH;

    const MAP_W = GRAPH_DATA.width;
    const MAP_H = GRAPH_DATA.height;

    const fallbackNodes = {

      aula_3: { x: 587, y: 724, label: "Salón 3" },
      escalera_este_media: { x: 626, y: 636, label: "Escalera oriental media" },
      pasillo_aulas_10_12: { x: 520, y: 566, label: "Pasillo salones 10, 11 y 12" },
      aula_10: { x: 480, y: 566, label: "Salón 10" },
      aula_11: { x: 544, y: 566, label: "Salón 11" },
      aula_12: { x: 606, y: 566, label: "Salón 12" },
      aula_artes: { x: 619, y: 610, label: "Aula de artes" },
      pasillo_este_vertical: { x: 648, y: 566, label: "Pasillo oriental" },
      entrada_sur_este: { x: 670, y: 783, label: "Acceso sur oriental" },
      sistemas: { x: 368, y: 171, label: "Sala de sistemas primer piso" },
      terminal_secundaria: { x: 300, y: 171, label: "Terminal secundaria" },
      sala_refuerzo: { x: 317, y: 54, label: "Sala de refuerzo" },
      cuadro_refuerzo: { x: 274, y: 54, label: "Cuadro de refuerzo" }
    };

    const fallbackEdges = [
      ["porteria", "entrada_alumnos"],
      ["entrada_alumnos", "pasillo_norte_oeste"],
      ["pasillo_norte_oeste", "pasillo_norte_centro"],
      ["pasillo_norte_centro", "pasillo_norte_sistemas"],
      ["pasillo_norte_sistemas", "pasillo_norte_teatro"],
      ["pasillo_norte_centro", "sala_refuerzo"],
      ["sala_refuerzo", "cuadro_refuerzo"],
      ["pasillo_norte_centro", "terminal_secundaria"],
      ["terminal_secundaria", "sistemas"],
      ["sistemas", "pasillo_norte_sistemas"],
      ["pasillo_norte_sistemas", "escalera_norte_centro"],
      ["pasillo_norte_teatro", "escalera_teatro_norte"],
      ["pasillo_norte_teatro", "teatro_norte"],
      ["teatro_norte", "teatro_sur"],
      ["teatro_sur", "escalera_teatro_sur"],
      ["teatro_sur", "pasillo_teatro_sur"],
      ["pasillo_teatro_sur", "rotonda_este"],
      ["rotonda_este", "rotonda_centro"],
      ["rotonda_centro", "rotonda_norte"],
      ["rotonda_centro", "rotonda_oeste"],
      ["rotonda_centro", "rotonda_sur"],
      ["rotonda_norte", "pasillo_norte_centro"],
      ["rotonda_oeste", "cancha_grande_puerta"],
      ["cancha_grande_puerta", "entrada_alumnos"],
      ["rotonda_oeste", "cancha_pequena_puerta"],
      ["cancha_pequena_puerta", "pasillo_aulas_oeste"],
      ["pasillo_aulas_oeste", "graderias"],
      ["pasillo_aulas_oeste", "escalera_oeste"],
      ["pasillo_aulas_oeste", "aula_7"],
      ["aula_7", "aula_8"],
      ["aula_8", "aula_9"],
      ["aula_9", "rotonda_sur"],
      ["pasillo_aulas_oeste", "aula_13"],
      ["aula_13", "pasillo_aulas_sur_oeste"],
      ["pasillo_aulas_sur_oeste", "aula_6"],
      ["aula_6", "aula_5"],
      ["aula_5", "aula_4"],
      ["aula_4", "escalera_sur_centro"],
      ["escalera_sur_centro", "pasillo_sur_centro"],
      ["pasillo_sur_centro", "pasillo_sur_este"],
      ["pasillo_sur_este", "entrada_sur_este"],
      ["pasillo_sur_este", "pasillo_aulas_este"],
      ["pasillo_aulas_este", "aula_1"],
      ["aula_1", "aula_2"],
      ["aula_2", "aula_3"],
      ["aula_3", "escalera_este_media"],
      ["escalera_este_media", "pasillo_este_vertical"],
      ["pasillo_este_vertical", "pasillo_aulas_10_12"],
      ["pasillo_aulas_10_12", "aula_10"],
      ["aula_10", "aula_11"],
      ["aula_11", "aula_12"],
      ["aula_12", "aula_artes"],
      ["pasillo_aulas_10_12", "rotonda_este"],
      ["pasillo_este_vertical", "pasillo_teatro_sur"],
      ["pasillo_este_vertical", "entrada_sur_este"]
    ];

    const nodes = GRAPH_DATA.nodes || fallbackNodes;
    const edges = GRAPH_DATA.edges || fallbackEdges;

    const locationGroups = [
      ["Accesos y puntos grandes", ["porteria", "entrada_alumnos", "rotonda_centro", "cancha_grande_puerta", "cancha_pequena_puerta", "teatro_norte", "teatro_sur"]],
      ["Salones primer piso", ["aula_1", "aula_2", "aula_3", "aula_4", "aula_5", "aula_6", "aula_7", "aula_8", "aula_9", "aula_10", "aula_11", "aula_12", "aula_13", "aula_artes"]],
      ["Escaleras", ["escalera_norte_centro", "escalera_teatro_norte", "escalera_teatro_sur", "escalera_oeste", "escalera_sur_centro", "escalera_este_media"]],
      ["Otros espacios", ["sistemas", "terminal_secundaria", "sala_refuerzo", "cuadro_refuerzo", "graderias"]]
    ];

    const aliases = {
      "501": "aula_9",
      "502": "aula_8",
      "503": "aula_7",
      "salon 1": "aula_1",
      "salon 2": "aula_2",
      "salon 3": "aula_3",
      "salon 4": "aula_4",
      "salon 5": "aula_5",
      "salon 6": "aula_6",
      "salon 7": "aula_7",
      "salon 8": "aula_8",
      "salon 9": "aula_9",
      "salon 10": "aula_10",
      "salon 11": "aula_11",
      "salon 12": "aula_12",
      "salon 13": "aula_13",
      "teatro": "teatro_norte",
      "porteria": "porteria"
    };

    const svg = document.getElementById("mapSvg");
    const viewport = document.getElementById("viewport");
    const graphLayer = document.getElementById("graphLayer");
    const markerLayer = document.getElementById("markerLayer");
    const routePath = document.getElementById("routePath");
    const routeGlow = document.getElementById("routeGlow");
    const startSelect = document.getElementById("start");
    const destSelect = document.getElementById("dest");
    const summary = document.getElementById("summary");
    const statusEl = document.getElementById("status");

    let scale = 1;
    let panX = 0;
    let panY = 0;
    let dragging = false;
    let lastPoint = null;
    const BASE_ROTATION = 90;
    const BASE_FIT_SCALE = 0.7;

    function addOptionsGroup(select, groupLabel, items, getValue, getLabel) {
      const group = document.createElement("optgroup");
      group.label = groupLabel;
      items.forEach((item) => {
        const option = document.createElement("option");
        option.value = getValue(item);
        option.textContent = getLabel(item);
        if (item.docente) {
          option.dataset.docente = item.docente;
          option.dataset.curso = item.curso;
          option.dataset.salon = item.salon;
        }
        group.appendChild(option);
      });
      select.appendChild(group);
    }

    function fillSelect(select, selected, mode = "places") {
      select.innerHTML = "";
      if (GRAPH_DATA.locations?.length) {
        if (mode === "destinations" && COURSE_DESTINATIONS.length) {
          const courseItems = COURSE_DESTINATIONS.filter((destination) => destination.tipo === "curso");
          const eventItems = COURSE_DESTINATIONS.filter((destination) => destination.tipo !== "curso");
          addOptionsGroup(
            select,
            "Cursos - primer piso",
            courseItems,
            (destination) => destination.node,
            (destination) => destination.label
          );
          addOptionsGroup(
            select,
            "Eventos y espacios generales",
            eventItems,
            (destination) => destination.node,
            (destination) => destination.label
          );
        }
        addOptionsGroup(
          select,
          "Lugares del mapa",
          GRAPH_DATA.locations,
          (location) => location.node,
          (location) => location.label
        );
        select.value = selected;
        return;
      }
      locationGroups.forEach(([groupLabel, ids]) => {
        const group = document.createElement("optgroup");
        group.label = groupLabel;
        ids.forEach((id) => {
          const option = document.createElement("option");
          option.value = id;
          option.textContent = nodes[id].label;
          group.appendChild(option);
        });
        select.appendChild(group);
      });
      select.value = selected;
    }

    function distance(a, b) {
      const na = nodes[a];
      const nb = nodes[b];
      return Math.hypot(na.x - nb.x, na.y - nb.y);
    }

    function buildAdjacency() {
      const graph = {};
      Object.keys(nodes).forEach((id) => graph[id] = []);
      edges.forEach(([a, b]) => {
        const cost = distance(a, b);
        graph[a].push({ id: b, cost });
        graph[b].push({ id: a, cost });
      });
      return graph;
    }

    const adjacency = buildAdjacency();

    function shortestPath(start, goal) {
      const pending = new Set(Object.keys(nodes));
      const dist = {};
      const prev = {};
      Object.keys(nodes).forEach((id) => dist[id] = Infinity);
      dist[start] = 0;

      while (pending.size) {
        let current = null;
        let best = Infinity;
        pending.forEach((id) => {
          if (dist[id] < best) {
            best = dist[id];
            current = id;
          }
        });

        if (!current || current === goal) break;
        pending.delete(current);

        adjacency[current].forEach(({ id, cost }) => {
          if (!pending.has(id)) return;
          const next = dist[current] + cost;
          if (next < dist[id]) {
            dist[id] = next;
            prev[id] = current;
          }
        });
      }

      if (start !== goal && !prev[goal]) return [];
      const path = [goal];
      while (path[0] !== start) path.unshift(prev[path[0]]);
      return path;
    }

    function polylineD(path) {
      if (!path.length) return "";
      return path.reduce((d, id, index) => {
        const node = nodes[id];
        return `${d}${index ? " L" : "M"} ${node.x} ${node.y}`;
      }, "");
    }

    function routeLength(path) {
      let total = 0;
      for (let i = 1; i < path.length; i++) total += distance(path[i - 1], path[i]);
      return total;
    }

    function drawGraph() {
      graphLayer.innerHTML = "";

      edges.forEach(([a, b]) => {
        const na = nodes[a];
        const nb = nodes[b];
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", na.x);
        line.setAttribute("y1", na.y);
        line.setAttribute("x2", nb.x);
        line.setAttribute("y2", nb.y);
        line.setAttribute("stroke", "transparent");
        line.setAttribute("stroke-width", "4");
        line.setAttribute("stroke-linecap", "round");
        graphLayer.appendChild(line);
      });

      Object.entries(nodes).forEach(([id, node]) => {
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", node.x);
        circle.setAttribute("cy", node.y);
        const isLabeledPlace = GRAPH_DATA.locations?.some((location) => location.node === id);
        circle.setAttribute("r", isLabeledPlace ? "1.05" : ".75");
        circle.setAttribute("class", isLabeledPlace ? "door" : "node");
        graphLayer.appendChild(circle);
      });
    }

    function drawMarkers(path) {
      markerLayer.innerHTML = "";
      if (!path.length) return;

      const origin = nodes[path[0]];
      const dest = nodes[path[path.length - 1]];

      const pulse = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      pulse.setAttribute("cx", dest.x);
      pulse.setAttribute("cy", dest.y);
      pulse.setAttribute("r", "1.8");
      pulse.setAttribute("class", "pulse");
      markerLayer.appendChild(pulse);

      [
        [origin, "marker-origin", 1.9],
        [dest, "marker-dest", 2.2]
      ].forEach(([node, className, radius]) => {
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", node.x);
        circle.setAttribute("cy", node.y);
        circle.setAttribute("r", radius);
        circle.setAttribute("class", className);
        markerLayer.appendChild(circle);
      });
    }

    function updateRoute() {
      const start = startSelect.value;
      const dest = destSelect.value;
      const selectedDest = destSelect.selectedOptions[0];

      if (start === dest) {
        routePath.setAttribute("d", "");
        routeGlow.setAttribute("d", "");
        markerLayer.innerHTML = "";
        panX = 0;
        panY = 0;
        applyTransform();
        summary.innerHTML = "<b>Ya estás ahí</b>El origen y el destino son el mismo punto.";
        statusEl.textContent = "Selecciona un destino diferente";
        return;
      }

      const path = shortestPath(start, dest);
      const d = polylineD(path);
      routePath.setAttribute("d", d);
      routeGlow.setAttribute("d", d);
      drawMarkers(path);

      const meters = Math.round(routeLength(path));
      statusEl.textContent = `${path.length} puntos de ruta`;
      const courseInfo = selectedDest?.dataset?.curso
        ? `<br>Curso: ${selectedDest.dataset.curso}<br>Ubicación: ${selectedDest.dataset.salon}`
        : "";
      summary.innerHTML = `
        <b>${nodes[start].label} -> ${selectedDest?.textContent || nodes[dest].label}</b>
        Ruta aproximada por pasillos: ${meters} unidades del plano.${courseInfo}
        <ul class="steps">
          ${path.map((id) => `<li>${nodes[id].label}</li>`).join("")}
        </ul>
      `;
      centerOnPath(path);
    }

    function applyTransform() {
      viewport.setAttribute(
        "transform",
        `translate(${panX} ${panY}) translate(${MAP_W / 2} ${MAP_H / 2}) scale(${scale * BASE_FIT_SCALE}) rotate(${BASE_ROTATION}) translate(${-MAP_W / 2} ${-MAP_H / 2})`
      );
    }

    function zoomAt(delta) {
      const next = Math.min(3.8, Math.max(.72, scale + delta));
      scale = next;
      applyTransform();
    }

    function resetView() {
      scale = 1;
      panX = 0;
      panY = 0;
      applyTransform();
    }

    function centerOnPath(path) {
      if (!path.length) return;
      scale = 1;
      panX = 0;
      panY = 0;
      applyTransform();
    }

    function pointerToSvg(event) {
      const pt = svg.createSVGPoint();
      pt.x = event.clientX;
      pt.y = event.clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    svg.addEventListener("pointerdown", (event) => {
      dragging = true;
      lastPoint = pointerToSvg(event);
      svg.classList.add("dragging");
      svg.setPointerCapture(event.pointerId);
    });

    svg.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      const point = pointerToSvg(event);
      panX += point.x - lastPoint.x;
      panY += point.y - lastPoint.y;
      lastPoint = point;
      applyTransform();
    });

    svg.addEventListener("pointerup", (event) => {
      dragging = false;
      svg.classList.remove("dragging");
      svg.releasePointerCapture(event.pointerId);
    });

    svg.addEventListener("wheel", (event) => {
      event.preventDefault();
      zoomAt(event.deltaY > 0 ? -.12 : .12);
    }, { passive: false });

    document.getElementById("routeBtn").addEventListener("click", updateRoute);
    document.getElementById("zoomIn").addEventListener("click", () => zoomAt(.18));
    document.getElementById("zoomOut").addEventListener("click", () => zoomAt(-.18));
    document.getElementById("resetView").addEventListener("click", resetView);
    startSelect.addEventListener("change", updateRoute);
    destSelect.addEventListener("change", updateRoute);

    fillSelect(startSelect, GRAPH_DATA.locations?.find((location) => location.id === "entrada_principal")?.node || "porteria", "places");
    fillSelect(destSelect, COURSE_DESTINATIONS[0]?.node || GRAPH_DATA.locations?.find((location) => location.id === "salon_9")?.node || "aula_9", "destinations");
    drawGraph();
    updateRoute();

    window.mapaPiso1 = { nodes, edges, aliases, shortestPath };
  </script>
</body>
</html>
