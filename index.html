<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>¿A dónde quieres ir?</title><link rel="stylesheet" href="app.css"></head><body><div class="app">
<header><div><h1>¿A dónde quieres ir?</h1><p>Busca el curso, docente o lugar.</p></div><span id="floorBadge" class="floor-badge">Piso 1</span></header>
<main><aside>
<div class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" autocomplete="off" placeholder="Ejemplo: 802, 8-2 o rectoría" aria-label="Buscar destino"><button id="clearSearch" type="button" aria-label="Limpiar búsqueda">×</button></div><div id="results" class="results" role="listbox"></div>
<div id="welcome" class="welcome"><p class="eyebrow">Destinos frecuentes</p><div id="quickPlaces" class="quick-places"></div><p class="origin">Tu recorrido comienza en <strong>Portería / entrada principal</strong>.</p></div>
<section id="routePanel" class="route-panel" hidden><button id="backSearch" class="back" type="button">← Buscar otro destino</button><div id="destinationCard" class="destination-card"></div><div id="instruction" class="instruction"></div><div class="tracker-panel"><div><strong>Tu posición</strong><span id="trackerStatus">Lista para iniciar.</span></div><button id="startTracking" type="button">Iniciar</button></div><div class="tracker-controls"><button id="stepBack" type="button">− Paso</button><button id="stepForward" type="button">+ Paso</button></div><div class="audio-controls"><button id="repeatAudio" type="button">🔊 Repetir</button><button id="toggleAudio" type="button">🔇 Silenciar</button></div><div class="segment-controls"><button id="previousSegment" type="button">Anterior</button><button id="nextSegment" type="button">Continuar</button></div></section>
<div class="map-tools"><button id="zoomIn" type="button">+</button><button id="zoomOut" type="button">−</button><button id="centerRoute" type="button">Centrar</button><button id="showAll" type="button">Ver todo</button></div>
</aside><section class="map-shell"><nav id="floorTabs" class="floor-tabs"><button data-floor="1" class="active">Piso 1</button><button data-floor="2">Piso 2</button><button data-floor="3">Piso 3</button></nav><div class="map-card"><svg id="mapSvg" viewBox="0 0 210 297"><g id="viewport"><image id="floorImage" href="piso1.svg" x="0" y="0" width="210" height="297" preserveAspectRatio="xMidYMid meet"></image><path id="routeGlow" class="route-glow"></path><path id="routePath" class="route-line"></path><g id="markers"></g><g id="positionLayer"></g></g></svg></div></section></main></div>
<script src="grafo-piso1.js"></script><script src="destinos-piso1.js"></script><script src="grafo-piso2.js"></script><script src="destinos-piso2.js"></script><script src="grafo-piso3.js"></script><script src="destinos-piso3.js"></script><script src="app.js"></script></body></html>
